name: Tests

on:
  push:
    branches: [ main ]
    paths:
    - '**.cs'
    - '**.csproj'
    - '**.props'
    - '**.targets'
    - '**.slnx'
  pull_request:
    branches: [ main ]
    paths:
    - '**.cs'
    - '**.csproj'
    - '**.props'
    - '**.targets'
    - '**.slnx'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: build-and-test-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DotnetFhirConnect.slnx

      - name: Build
        run: dotnet build DotnetFhirConnect.slnx -c Release --no-restore

      - name: Test
        run: dotnet test DotnetFhirConnect.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"
